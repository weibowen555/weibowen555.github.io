- title: Research Interests
  type: list
  contents:
    - >
      My research sits at the intersection of trustworthy AI and LLM reasoning, with a growing focus on
      agentic AI safety and reinforcement learning for building reliable, autonomous systems. I develop
      interpretable learning methods—including prototype-based and neuro-symbolic approaches—that make model
      decisions transparent, auditable, and robust for high-stakes applications, revealing what evidence or
      rules drive a prediction and when the model may fail.
    - >
      In parallel, I investigate agent safety evaluation and reinforcement learning techniques for agentic
      reasoning, including safety benchmarking under adversarial prompt injection and self-play frameworks.
      Ultimately, I aim to build AI systems that are both interpretable in their inner logic and safe and
      reliable in autonomous, evidence-grounded decision-making.

