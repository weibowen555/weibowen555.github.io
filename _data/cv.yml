      institution: Amazon Web Services (AWS), Amazon Bedrock Guardrails, Seattle, WA
      year: May 2026 – Aug 2026
      description:
        - Developed **HILT**, converting temporal changes in safety-verifier signals into localized supervision for safer foundation-model agents
        - Designed recoverable-window localization, privileged trajectory repair, and on-policy distillation; the student policy needs no safety verifier at inference
